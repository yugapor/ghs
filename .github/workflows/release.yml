name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0"
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Test
        run: zig build test

      - name: Build
        run: |
          mkdir -p dist
          for t in x86_64-windows aarch64-windows x86_64-macos aarch64-macos x86_64-linux-musl aarch64-linux-musl; do
            zig build -Dtarget=$t -Doptimize=ReleaseSmall --prefix out/$t
            name=ghs-${TAG}-$t
            if [[ $t == *windows ]]; then
              (cd out/$t/bin && zip -q ../../../dist/$name.zip ghs.exe)
            else
              tar -czf dist/$name.tar.gz -C out/$t/bin ghs
            fi
          done
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --clobber || gh release create "$TAG" dist/* --generate-notes
