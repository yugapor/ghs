name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Test
        run: zig build test

      - name: Build
        run: |
          mkdir -p dist
          for t in x86_64-windows aarch64-windows x86_64-macos aarch64-macos x86_64-linux-musl aarch64-linux-musl; do
            zig build -Dtarget=$t -Doptimize=ReleaseSmall --prefix out/$t
            name=ghs-${GITHUB_REF_NAME}-$t
            if [[ $t == *windows ]]; then
              (cd out/$t/bin && zip -q ../../../dist/$name.zip ghs.exe)
            else
              tar -czf dist/$name.tar.gz -C out/$t/bin ghs
            fi
          done
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
